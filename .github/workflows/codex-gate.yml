# One check, "codex-gate", on the pull request's head commit that passes only
# when the Codex review has concluded on that exact commit and every review
# thread is resolved. Codex itself posts no check, only a summary comment it
# edits as it works, so this job reads that comment and the review threads
# and writes the check the main ruleset requires (docs/MERGE_AUTOMATION.md).
#
# It re-runs on every event that can change the answer: a push to the PR,
# Codex editing its summary, a review, a thread resolved or unresolved.
name: codex-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  gate:
    name: codex-gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            if (!number) { core.info("Not a pull request event; nothing to gate."); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") { core.info(`PR #${number} is ${pr.state}; nothing to gate.`); return; }
            const head = pr.head.sha;
            const short = head.slice(0, 7);

            // 1. Codex's summary comment names the commit it reviewed and its status.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const summary = comments.find((c) => (c.body || "").includes("<!-- codex-pull-request-review-summary -->"));
            let codex = "no Codex summary comment yet";
            let concluded = false;
            if (summary) {
              const row = summary.body.split("\n").find((l) => l.startsWith("|") && l.includes("`" + short + "`"));
              if (!row) codex = `Codex has not reviewed ${short} yet`;
              else if (/Completed/.test(row)) { codex = `Codex completed on ${short}`; concluded = true; }
              else codex = `Codex is still running on ${short}`;
            }

            // 2. Every review thread resolved (Codex and Copilot findings included).
            const q = `query($owner: String!, $repo: String!, $n: Int!) {
              repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
                reviewThreads(first: 100) { nodes { isResolved } } } } }`;
            const r = await github.graphql(q, { owner, repo, n: number });
            const unresolved = r.repository.pullRequest.reviewThreads.nodes.filter((t) => !t.isResolved).length;

            const ok = concluded && unresolved === 0;
            const summaryText = `${codex}. Unresolved review threads: ${unresolved}.`;
            await github.rest.checks.create({
              owner, repo, name: "codex-gate", head_sha: head, status: "completed",
              conclusion: ok ? "success" : "failure",
              output: { title: ok ? "Codex concluded, every thread resolved" : "Not ready to merge", summary: summaryText },
            });
            core.info(`codex-gate on ${short}: ${ok ? "success" : "failure"} (${summaryText})`);
